<!doctype html>
<!--
  ===================================================================
   Uppgift 2: Knappen och rubriken   (5p, Lätt)
  ===================================================================

   Öppna filen i en webbläsare (dubbelklicka) så ser ni hur den ser ut nu.

   ATT GÖRA
     1. Byt knappens text mot ert lagnamn. Texten står mellan
        <button ...> och </button> längst ner i filen.
     2. Ändra teckenstorleken på rubriken. Leta upp h1 inne i <style>
        och ändra siffran i font-size. 2rem är ungefär dubbelt så stort
        som vanlig text, 4rem är dubbelt så stort som det.
     3. Ladda om sidan i webbläsaren och ta en skärmdump.

   BEVIS: commit plus en skärmdump i repot som visar ändringen.
  ===================================================================
-->
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Knappen och rubriken - ChasHack</title>

    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #13131a;
        color: #f5f5f5;
        max-width: 40rem;
        margin: 0 auto;
        padding: 3rem 1.5rem;
      }

      h1 {
        font-size: 2rem;   /* <- ändra den här siffran */
      }

      .knapp {
        background: #7c5cff;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h1>Vår sida</h1>
    <p>Knappen nedanför ska heta samma sak som vårt lag.</p>

    <button class="knapp">Byt ut mig mot lagnamnet</button>
  </body>
</html>
